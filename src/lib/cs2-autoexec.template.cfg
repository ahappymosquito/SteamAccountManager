// Steam Account Manager 管理的 CS2 autoexec.cfg
// 切号时复制到游戏 game\csgo\cfg，并以 +exec 本文件名启动。
// 不会改写游戏实时生成的 .vcfg。可用「刷新注释」按当前 CS2 指令库更新行尾说明。

// --- 准星 ---
cl_crosshairstyle 4 // 准星样式：2 经典动态（后坐力/散布反馈）；4 经典静态；0/1/3 已禁用；5 旧版动态（反馈不准）
cl_crosshairsize 2 // 准星线长度
cl_crosshairgap -1 // 准星中心间距，可为负数
cl_crosshairthickness 0.5 // 准星线条粗细，常见 0–6
cl_crosshairdot 0 // 中心点：0 关 1 开
cl_crosshair_drawoutline 1 // 深色轮廓：0 关 1 开
cl_crosshair_outlinethickness 1 // 轮廓粗细 0–3
cl_crosshair_t 0 // T 型准星（隐藏上线）：0 关 1 开
cl_crosshaircolor 1 // 颜色：0 红 1 绿 2 黄 3 蓝 4 青 5 自定义 RGB
cl_crosshaircolor_r 50 // 自定义红色 0–255，需 color 5
cl_crosshaircolor_g 250 // 自定义绿色 0–255，需 color 5
cl_crosshaircolor_b 50 // 自定义蓝色 0–255，需 color 5
cl_crosshairusealpha 1 // 使用自定义透明度：0 关 1 开
cl_crosshairalpha 255 // 准星不透明度 0–255
cl_crosshair_recoil 0 // 开火时准星跟随后坐力：0 关 1 开
cl_crosshairgap_useweaponvalue 0 // 按当前武器调整间距（动态准星）：0 关 1 开
cl_crosshair_sniper_width 1 // 狙击开镜准星线宽
cl_crosshair_dynamic_splitdist 7 // 仅 style 2：内外准星分离距离
cl_crosshair_dynamic_splitalpha_innermod 1 // 仅 style 2：内层透明倍率 0–1
cl_crosshair_dynamic_splitalpha_outermod 0.5 // 仅 style 2：外层透明倍率 0.3–1
cl_crosshair_dynamic_maxdist_splitratio 0.35 // 仅 style 2：内外层长度比 0–1

// --- 声音与语音 ---
volume 1 // 游戏主音量 0–1
snd_menumusic_volume 0 // 主菜单音乐音量 0–1
snd_roundstart_volume 0 // 回合开始音乐 0–1
snd_roundend_volume 0 // 回合结束音乐 0–1
snd_mvp_volume 0 // MVP 音乐 0–1
snd_mapobjective_volume 0.3 // 地图目标提示音乐 0–1
snd_tensecondwarning_volume 0.3 // 十秒警告音量 0–1
snd_deathcamera_volume 0 // 死亡镜头音乐 0–1
snd_mute_losefocus 0 // 切出游戏时静音：0 关 1 开
voice_modenable 1 // 队伍语音总开关：0 关 1 开
snd_voipvolume 1 // 队友语音音量 0–1（CS2 主控）
voice_always_sample_mic 0 // 持续采样麦克风：0 关 1 开

// --- 鼠标与操作 ---
sensitivity 1 // 鼠标灵敏度
zoom_sensitivity_ratio 1 // 开镜灵敏度倍率（CS2 使用此名）
cl_righthand 1 // 持枪左右手：1 右手 0 左手（CS2 已恢复）
cl_prefer_lefthanded 0 // 偏好左手持枪：0 关 1 开

// --- HUD、雷达与持枪视角 ---
hud_scaling 0.85 // HUD 整体缩放，CS2 常见 0.5–1
cl_hud_color 0 // HUD 颜色 0–11
cl_radar_scale 0.4 // 雷达地图缩放 0.25–1
cl_radar_always_centered 0 // 玩家是否固定在雷达中心：0 关 1 开
cl_radar_rotate 1 // 雷达随视角旋转：0 关 1 开
cl_radar_icon_scale_min 0.6 // 雷达图标最小缩放
cl_radar_square_with_scoreboard 1 // 记分板打开时雷达改为方形：0 关 1 开
viewmodel_fov 68 // 持枪模型视野 54–68
viewmodel_offset_x 2.5 // 持枪模型左右偏移
viewmodel_offset_y 0 // 持枪模型前后偏移
viewmodel_offset_z -1.5 // 持枪模型上下偏移
viewmodel_presetpos 1 // 持枪预设：1 桌面 2 大衣 3 经典；改 offset 后以自定义为准
cl_showloadout 1 // 始终显示装备栏：0 关 1 开
cl_hud_telemetry_frametime_show 2 // 帧时间：0 关 1 异常时 2 始终（替代 net_graph）
cl_hud_telemetry_ping_show 2 // Ping：0 关 1 异常时 2 始终
cl_hud_telemetry_net_quality_graph_show 1 // 网络质量图：0 关 1 异常时 2 始终
cl_hud_telemetry_server_misprediction_show 1 // 服务器预测偏差：0 关 1 异常时 2 始终

// --- 性能与网络 ---
fps_max 0 // 最大帧率，0 表示不限制
rate 786432 // 客户端网络字节速率
mm_dedicated_search_maxping 80 // 匹配接受的最高延迟（毫秒）
