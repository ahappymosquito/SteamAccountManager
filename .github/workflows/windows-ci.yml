# Builds and tests the Windows application for main and pull requests.
name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Package portable edition
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $portableDirectory = "Steam-Account-Manager-$version-windows-x64-portable"
          New-Item -ItemType Directory -Path $portableDirectory | Out-Null
          Copy-Item "src-tauri/target/release/steam-account-manager.exe" "$portableDirectory/Steam Account Manager.exe"
          Copy-Item "README.md", "LICENSE" $portableDirectory
          Compress-Archive -Path $portableDirectory -DestinationPath "$portableDirectory.zip"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Steam-Account-Manager-windows-x64-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows portable edition
        uses: actions/upload-artifact@v7
        with:
          name: Steam-Account-Manager-windows-x64-portable-${{ github.sha }}
          path: Steam-Account-Manager-*-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14
